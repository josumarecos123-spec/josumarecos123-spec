<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="Calculadra.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white text-center">
                    <h1 >Calculadora basica</h1>
              </div>
              <div class="card-body">
                <div class="form-group">
                    <label for="numero">Primer Numero</label>
                    <input type="number" class="form-control" name="numero" id="numero">
                </div>

                <div class="form-group">
                    <label for="Numero2">Segundo Numero</label>
                    <input type="number" class="form-control" name="numero2" id="numero2">
                </div>
                
                <button type="button" class="btn btn-success text-white btn-block  mb-2" onclick="sumar()">Sumar</button>
                <button class="btn btn-warning text-dark btn-block  mb-2"  onclick="restar()">Restar</button>
                <button class="btn btn-info text-white btn-block  mb-2"  onclick="dividir()">Dividir</button>
                <button class="btn btn-danger text-white btn-block  mb-2" onclick="multi()">Multiplicar</button>

                  <div>
                    <label for="resultado">Resultado</label>
                    <input type="number" class="form-control" name="numero" id="resultado" readonly>
                </div>
                </div>
            </div>
        </div>
        </div>
    </div>
      <script src="calculadora.js"></script>
</body>
</html>
